name: 60dB
description: >-
  60dB was a personalized short-form audio and podcast application built by Tiny
  Garage Labs, founded in 2016 by John Ciancutti, Steve Henn, and Steve McLendon.
  The app curated and recommended short radio-style audio stories tailored to a
  listener's habits, and was available on iOS, Android, and the web as well as
  through Alexa, Android Auto, and CarPlay. It was backed by Bloomberg Beta,
  Khosla Ventures, and Rivet Ventures. Google acqui-hired the founding team in
  October 2017 and the 60dB service was shut down on November 10, 2017. The
  company is defunct and publishes no developer program, API, or machine-readable
  interface today; the 60db.com domain now resolves to a parked placeholder page.
  This profile is retained as a historical portfolio-company record for the API
  Evangelist network.
